<!DOCTYPE html>
<html lang="" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-compatible" content="IE-edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>فرم ثبت نام</title>
        <link rel="icon" type="image/svg" href="/images/Favicon.svg">
        <link rel="stylesheet" href="./styles/app.css">
    </head>
    <body>
        <form action="" method="get" >
            <img src="./images/Logo.svg" alt="logo" width="100px">
            <br>
            <input type="text"  name="name" placeholder="نام" required autofocus>
            <br>
            <input type="email" name="email" placeholder="ایمیل" required>
            <br>
            <input type="password" name="password" min="4" max="8" placeholder="رمز عبور" required maxlength="8">
            <br>
            <input type="password" name="password-confirm" min="4" max="8" placeholder="تکرار رمز عبور" required maxlength="8">
            <br>
            <input type="checkbox" name="checkbox" required id="check">
            <label for="check"><a href="#">شرایط و قوانین </a>سایت را میپذیرم</label>
            <br>
            <br>
            <input type="submit" value="ثبت نام">

        </form>
    </body>


</html>
